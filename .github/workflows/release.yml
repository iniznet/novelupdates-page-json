name: Release

# A tag publishes a release; the manual run exists so a release can be rebuilt
# without moving a tag. Both take the same path: test, stage, zip, publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Stage both browsers
        run: npm run build

      - name: Zip every shape
        run: |
          set -eu
          VERSION="$(node -p "require('./manifest.json').version")"
          NAME=nu-page-json

          (cd dist/chrome && zip -qr "../../${NAME}-chrome-v${VERSION}.zip" .)
          (cd dist/firefox && zip -qr "../../${NAME}-firefox-v${VERSION}.xpi" .)

          # The same tree, under the name a "load unpacked" reader looks for.
          cp "${NAME}-chrome-v${VERSION}.zip" "${NAME}-chrome-v${VERSION}-unpacked.zip"
          cp "${NAME}-firefox-v${VERSION}.xpi" "${NAME}-firefox-v${VERSION}-unpacked.zip"

          ls -l *.zip *.xpi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="$(node -p "require('./manifest.json').version")"
          NAME=nu-page-json

          gh release create "${RELEASE_TAG}" \
            "${NAME}-chrome-v${VERSION}.zip" \
            "${NAME}-chrome-v${VERSION}-unpacked.zip" \
            "${NAME}-firefox-v${VERSION}.xpi" \
            "${NAME}-firefox-v${VERSION}-unpacked.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
