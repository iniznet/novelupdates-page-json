<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Fenrir Realm — page JSON</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				font:
					13px/1.4 system-ui,
					sans-serif;
				margin: 0;
				padding: 12px;
				width: 320px;
			}
			h1 {
				font-size: 13px;
				margin: 0 0 8px;
			}
			p {
				margin: 0 0 8px;
			}
			.muted {
				opacity: 0.7;
			}
			ul {
				margin: 0 0 8px;
				padding-left: 16px;
			}
			button {
				font: inherit;
				padding: 6px 10px;
				border-radius: 6px;
				border: 1px solid currentColor;
				background: transparent;
				cursor: pointer;
			}
			button:disabled {
				cursor: default;
				opacity: 0.5;
			}
			.error {
				color: #b3261e;
			}
		</style>
	</head>
	<body>
		<h1>Novel Updates page → JSON</h1>
		<p id="status" class="muted">Reading the page…</p>
		<ul id="summary" hidden></ul>
		<button id="copy" disabled>Copy JSON</button>
		<script type="module" src="./popup.js"></script>
	</body>
</html>
